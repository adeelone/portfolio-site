<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="robots" content="{{ROBOTS_META}}" />
    <meta name="theme-color" content="#f7f5ef" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:image" content="{{SITE_URL}}/assets/aden-headshot.png" />
    <meta property="og:image:alt" content="Portrait of Aden Ramirez" />
    <meta property="og:url" content="{{CANONICAL}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta name="twitter:description" content="{{DESCRIPTION}}" />
    <meta name="twitter:image" content="{{SITE_URL}}/assets/aden-headshot.png" />
    <link rel="canonical" id="canonical-link" href="{{CANONICAL}}" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/aden-headshot.png" />
    <link rel="stylesheet" href="/styles.css?v=2" />
    <link rel="stylesheet" href="/polish.css?v=2" />
    <script type="application/ld+json" id="structured-data">{{STRUCTURED_DATA}}</script>
    <script src="/client.js?v=3" defer></script>
    {{PAGE_SCRIPT}}
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="/">Aden Ramirez</a>
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="nav">Menu</button>
      <nav id="nav" aria-label="Primary navigation">
        <a href="/work">Work</a>
        <a href="/jobs">Jobs</a>
        <a href="/education">Education</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
        <button class="nav-resume" type="button" data-resume-open>Resume</button>
      </nav>
    </header>
    <main id="content" tabindex="-1">{{CONTENT}}</main>
    <footer class="site-footer">
      <div><strong>Aden Ramirez</strong><span>Software engineer and CS student in El Paso.</span></div>
      <div class="footer-links"><a href="/contact">Contact</a><a href="mailto:adeemra@gmail.com">Email</a><a href="https://github.com/adeelone" target="_blank" rel="noopener noreferrer">GitHub</a><a href="https://linkedin.com/in/aden-ramirez-cs" target="_blank" rel="noopener noreferrer">LinkedIn</a></div>
      <small>© <span id="year"></span> Aden Ramirez. Built by hand, kept honest. <a href="/play">Bored? Play a quick game.</a></small>
    </footer>
    <dialog class="resume-dialog" id="resume-dialog" aria-labelledby="resume-title">
      <div class="resume-dialog-header">
        <div><span class="eyebrow">Documents</span><h2 id="resume-title">Resume</h2></div>
        <button class="resume-close" type="button" data-resume-close aria-label="Close resume viewer">Close</button>
      </div>
      <div class="resume-switcher" role="group" aria-label="Choose resume version">
        <button type="button" class="active" data-resume-src="/assets/Aden_Ramirez_Resume.pdf" data-resume-preview="/assets/resume-technical-preview.png">Technical</button>
        <button type="button" data-resume-src="/assets/Aden_Ramirez_Resume_General.pdf" data-resume-preview="/assets/resume-general-preview.png">General</button>
        <a id="resume-download" href="/assets/Aden_Ramirez_Resume.pdf" download>Download PDF</a>
      </div>
      <div class="resume-preview"><img id="resume-frame" alt="Preview of Aden Ramirez's technical resume"></div>
    </dialog>
    <noscript>JavaScript is optional; interactive filters and the resume dialog require it.</noscript>
  </body>
</html>
