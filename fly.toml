# fly.toml app configuration file generated for mysite-bold-aurora-9442 on 2026-09-14T17:48:34-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mysite-bold-aurora-9442'
primary_region = 'dfw'
kill_signal = 'SIGTERM'
kill_timeout = 15

[build]

[env]
  SITE_URL = 'https://adenramirez.dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '5s'

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
