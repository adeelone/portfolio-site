services:
  - type: web
    name: aden-ramirez-portfolio
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        value: https://aden-ramirez-portfolio.onrender.com
